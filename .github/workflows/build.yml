# Builds LPT Pro for Windows (installer + Store package) and Linux (.deb) on every push.
# Pushing a tag like v0.16.0 also creates a GitHub Release with the files attached.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pip-licenses
      - name: Self-test
        run: python -m lptpro --check --demo tests/demo_phone
      - name: Build program
        run: pyinstaller --noconfirm packaging/lptpro.spec
      - name: License texts
        shell: bash
        run: |
          mkdir -p dist/LPTPro/licenses
          cp LICENSE THIRD-PARTY-NOTICES.md dist/LPTPro/licenses/
          pip-licenses --with-license-file --no-license-path --format=plain-vertical --ignore-packages pyinstaller pyinstaller-hooks-contrib pip-licenses altgraph prettytable wcwidth packaging setuptools pip > dist/LPTPro/licenses/THIRD-PARTY-LICENSES.txt
      - name: Store package (MSIX)
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: powershell -File packaging\windows\build_msix.ps1 -Dist dist\LPTPro -Out out
      - uses: actions/upload-artifact@v4
        with:
          name: windows-store-package
          path: out/*.msix
      - name: Installer (.exe) and test zip
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          $ver = python -c "import lptpro; print(lptpro.__version__)"
          & $iscc /Q "/DAppVersion=$ver" "/DDistDir=..\..\dist\LPTPro" packaging\windows\lptpro.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
          $zipdir = "dist\LPT-Pro-$ver-Windows-Test"
          New-Item -ItemType Directory $zipdir -Force | Out-Null
          Copy-Item "dist\LPT-Pro-Setup-$ver.exe", "packaging\windows\READ ME FIRST.txt" $zipdir
          Compress-Archive -Force -Path "$zipdir\*" -DestinationPath "out\LPT-Pro-$ver-Windows-Test.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: out/*.zip

  linux:
    runs-on: ubuntu-22.04        # oldest supported base: works on Ubuntu 22.04+ / Mint 21+ / Debian 12+
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libegl1 fakeroot
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pip-licenses
      - name: Self-test
        run: QT_QPA_PLATFORM=offscreen python -m lptpro --check --demo tests/demo_phone
      - name: Build program
        run: pyinstaller --noconfirm packaging/lptpro.spec
      - name: License texts
        run: |
          mkdir -p dist/LPTPro/licenses
          cp LICENSE THIRD-PARTY-NOTICES.md dist/LPTPro/licenses/
          pip-licenses --with-license-file --no-license-path --format=plain-vertical --ignore-packages pyinstaller pyinstaller-hooks-contrib pip-licenses altgraph prettytable wcwidth packaging setuptools pip > dist/LPTPro/licenses/THIRD-PARTY-LICENSES.txt
      - name: Package (.deb)
        run: packaging/linux/build_deb.sh dist/LPTPro out
      - name: Test install
        run: |
          sudo apt-get install -y ./out/*.deb
          QT_QPA_PLATFORM=offscreen lpt-pro --check --demo tests/demo_phone
      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: out/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Fixed file names (so the download buttons always get the newest version)
        run: |
          mkdir upload
          cp artifacts/windows-installer/*.zip upload/LPT-Pro-Windows.zip
          cp artifacts/linux-deb/*.deb upload/LPT-Pro-Linux.deb
      - uses: softprops/action-gh-release@v2
        with:
          files: upload/*
          generate_release_notes: true
